---
name: CI

on:
  push:
  pull_request:

jobs:
  ubuntu-fuse2:
    name: Ubuntu with FUSE 2
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse-dev
      - name: Build
        run: .github/workflows/scripts/build.sh
      - name: Test
        run: .github/workflows/scripts/test.sh

  ubuntu-fuse3:
    name: Ubuntu with FUSE 3
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev
      - name: Build
        run: .github/workflows/scripts/build.sh
      - name: Test
        run: .github/workflows/scripts/test.sh

  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          brew update
          brew install automake macfuse
      - name: Build
        run: .github/workflows/scripts/build.sh
      - name: Test
        run: .github/workflows/scripts/test.sh

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          prepare: pkg install -y autoconf automake fusefs-libs libublio pkgconf
          run: |
            .github/workflows/scripts/build.sh
            .github/workflows/scripts/test.sh
